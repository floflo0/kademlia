name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'

      - name: Install protoc
        run: |
          sudo apt update
          sudo apt install -y protobuf-compiler

      - name: Install Go protobuf plugins
        run: go install google.golang.org/protobuf/cmd/protoc-gen-go@latest

      - name: Generate
        run: go generate -v -x ./...

      - name: Build
        run: go build -v -o kademlia ./cmd/kademlia

      - name: Tests
        run: go test -v -race ./...

      - name: Vet
        run: go vet ./...

      - name: Check formatting
        run: test -z "$(gofmt -l .)"
